<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寰宇签途 · 出国签证一站式导览</title>
<style>
  :root {
    --bg: #0b1219;
    --bg-card: #15202b;
    --bg-card-hover: #1a2d3d;
    --bg-tag: #1e3044;
    --accent: #f0a050;
    --accent-soft: #c88030;
    --blue: #4a90d9;
    --green: #5cb878;
    --purple: #8b7ec8;
    --red: #d9645a;
    --text: #e0dcd5;
    --text-dim: #8899aa;
    --text-bright: #f5f0e8;
    --border: #243447;
    --radius: 14px;
    --radius-sm: 8px;
    --font: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --transition: 0.3s ease;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── 世界地图水印背景 ── */
  .world-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.04;
    background:
      radial-gradient(ellipse at 15% 40%, rgba(80,140,200,0.9) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 30%, rgba(80,140,200,0.7) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 70%, rgba(80,140,200,0.5) 0%, transparent 45%),
      radial-gradient(ellipse at 30% 20%, rgba(60,120,180,0.6) 0%, transparent 40%),
      radial-gradient(ellipse at 70% 65%, rgba(60,120,180,0.6) 0%, transparent 40%),
      radial-gradient(ellipse at 10% 70%, rgba(50,110,170,0.5) 0%, transparent 35%),
      radial-gradient(ellipse at 85% 50%, rgba(50,110,170,0.5) 0%, transparent 35%),
      radial-gradient(circle at 50% 45%, rgba(40,100,160,0.4) 0%, transparent 60%);
  }

  /* ── 网格线模拟经纬线 ── */
  .grid-lines {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.03;
    background-image:
      linear-gradient(rgba(120,180,220,1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,180,220,1) 1px, transparent 1px);
    background-size: 80px 80px;
  }

  /* ── 主容器 ── */
  .main {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 24px 60px;
  }

  /* ── Hero ── */
  .hero {
    text-align: center;
    padding: 50px 20px 30px;
  }
  .hero-icon { font-size: 56px; margin-bottom: 12px; }
  .hero h1 {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--accent), #f5c882, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }
  .hero p {
    color: var(--text-dim);
    font-size: 16px;
    letter-spacing: 2px;
    max-width: 500px;
    margin: 0 auto;
  }
  .notice-bar {
    max-width: 600px;
    margin: 16px auto 0;
    padding: 10px 18px;
    background: rgba(240,160,80,0.08);
    border: 1px solid rgba(240,160,80,0.2);
    border-radius: 8px;
    color: var(--accent);
    font-size: 13px;
    text-align: center;
    letter-spacing: 0.5px;
  }

  /* ── 搜索 ── */
  .search-wrap {
    max-width: 500px;
    margin: 0 auto 32px;
    position: relative;
  }
  .search-input {
    width: 100%;
    padding: 14px 18px 14px 44px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 28px;
    color: var(--text-bright);
    font-size: 15px;
    font-family: var(--font);
    outline: none;
    transition: var(--transition);
  }
  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(240,160,80,0.12);
  }
  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 16px;
  }

  /* ── 分类标签 ── */
  .filter-tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .filter-tab {
    padding: 10px 22px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 24px;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    transition: var(--transition);
    font-family: var(--font);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .filter-tab:hover { border-color: var(--accent); color: var(--text-bright); }
  .filter-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1a1a;
    font-weight: 600;
  }
  .filter-tab .count {
    font-size: 11px;
    margin-left: 4px;
    opacity: 0.7;
  }

  /* ── 统计条 ── */
  .stats-bar {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 24px;
  }

  /* ── 卡片网格 ── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 20px;
  }

  .visa-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }
  .visa-card:hover {
    background: var(--bg-card-hover);
    border-color: #3a5070;
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .visa-card::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 80px; height: 80px;
    background: radial-gradient(circle, rgba(240,160,80,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .card-flag { font-size: 32px; }
  .card-country {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-bright);
    letter-spacing: 2px;
  }

  .card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .card-tag {
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .tag-whv { background: rgba(240,160,80,0.15); color: var(--accent); }
  .tag-student { background: rgba(74,144,217,0.15); color: var(--blue); }
  .tag-nomad { background: rgba(92,184,120,0.15); color: var(--green); }
  .tag-immigration { background: rgba(139,126,200,0.15); color: var(--purple); }
  .tag-hot { background: rgba(217,100,90,0.15); color: var(--red); }

  .card-desc {
    color: var(--text);
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 14px;
  }

  .card-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .card-info-item {
    color: var(--text-dim);
  }
  .card-info-item strong {
    color: var(--text);
    display: block;
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .card-requirements {
    background: rgba(255,255,255,0.03);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.8;
  }
  .card-requirements strong {
    color: var(--text);
    font-size: 12px;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 4px;
  }

  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-soft));
    color: #1a1a1a;
    text-decoration: none;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    transition: var(--transition);
  }
  .card-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(240,160,80,0.3);
  }

  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-size: 16px;
    grid-column: 1 / -1;
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 12px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  .footer a { color: var(--accent); text-decoration: none; }

  /* ── 响应式 ── */
  @media (max-width: 768px) {
    .hero h1 { font-size: 28px; }
    .hero p { font-size: 14px; }
    .card-grid { grid-template-columns: 1fr; }
    .filter-tab { padding: 8px 16px; font-size: 13px; }
    .card-info { grid-template-columns: 1fr; }
  }
</style>
</head>

  <!-- 统计 -->

  <div class="card-grid" id="card-grid"></div>

  </div>
</div>

// ═══════════════════════════════════════════════════════════
// 渲染逻辑
// ═══════════════════════════════════════════════════════════
let activeCat = 'all';
let searchQuery = '';

function getTagClass(cat) {
  const map = { whv: 'tag-whv', student: 'tag-student', nomad: 'tag-nomad', immigration: 'tag-immigration' };
  return map[cat] || '';
}

function getCatLabel(cat) {
  const map = { whv: '打工度假', student: '留学签证', nomad: '数字游民', immigration: '移民工作' };
  return map[cat] || cat;
}

function renderCards() {
  const grid = document.getElementById('card-grid');
  const query = searchQuery.toLowerCase().trim();

  let filtered = VISA_DATA.filter(v => {
    if (activeCat !== 'all' && v.cat !== activeCat) return false;
    if (query) {
      const searchStr = (v.country + v.visaName + v.desc + getCatLabel(v.cat) + (v.timeline || '') + (v.other || '')).toLowerCase();
      return searchStr.includes(query);
    }
    return true;
  });

  // 更新统计
  document.getElementById('stats-bar').textContent = `共 ${filtered.length} 个签证项目`;

  // 更新分类计数
  document.querySelectorAll('.filter-tab').forEach(tab => {
    const cat = tab.dataset.cat;
    const count = cat === 'all' ? VISA_DATA.length : VISA_DATA.filter(v => v.cat === cat).length;
    tab.querySelector('.count').textContent = count;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">🔍 没有找到匹配的签证信息<br><span style="font-size:13px;">试试其他关键词或分类</span></div>';
    return;
  }

  grid.innerHTML = filtered.map(v => `
    <div class="visa-card">
      <div class="card-header">
        <span class="card-flag">${v.flag}</span>
        <span class="card-country">${v.country}</span>
      </div>
      <div class="card-tags">
        <span class="card-tag ${getTagClass(v.cat)}">${getCatLabel(v.cat)}</span>
        ${v.hot ? '<span class="card-tag tag-hot">🔥 热门</span>' : ''}
      </div>
      <div class="card-desc"><strong>${v.visaName}</strong><br>${v.desc}</div>
      <div class="card-info">
        <div class="card-info-item"><strong>⏰ 申请时间</strong>${v.timeline}</div>
        ${v.quota ? `<div class="card-info-item"><strong>📊 名额</strong>${v.quota}</div>` : ''}
      </div>
      <div class="card-requirements">
        <strong>📋 核心要求</strong>
        • 年龄：${v.age}<br>
        • 资金：${v.funds}<br>
        • ${v.other}
      </div>
      <a class="card-link" href="${v.link}" target="_blank" rel="noopener">
        ${v.linkText}
      </a>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════════════════
// 事件绑定
// ═══════════════════════════════════════════════════════════
document.getElementById('search-input').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderCards();
});

document.getElementById('filter-tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.filter-tab');
  if (!tab) return;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeCat = tab.dataset.cat;
  renderCards();
});

// ═══════════════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════════════
renderCards();
</script>
